name: Python regression tests
on:
  push:
    branches: [main, feature/saved-options-panel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression suite
        id: regression
        continue-on-error: true
        env:
          FURLONG_DATA_DIR: ${{ runner.temp }}/furlong-data
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "${{ runner.temp }}/furlong-tests.log"
      - name: Verify database backup and restore
        id: backup
        continue-on-error: true
        env:
          FURLONG_DATA_DIR: ${{ runner.temp }}/furlong-data
        run: |
          set -o pipefail
          {
            python -c "import app; app.init_db()"
            python scripts/backup_database.py "${{ runner.temp }}/furlong-backups"
            python scripts/verify_restore.py "${{ runner.temp }}/furlong-backups/"*.db
          } 2>&1 | tee "${{ runner.temp }}/furlong-backup.log"
      - name: Report failing diagnostics in a private repository issue
        if: ${{ always() && github.event_name == 'push' && (steps.regression.outcome == 'failure' || steps.backup.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          log = "\n\n".join((root / f).read_text(errors="replace")[-14000:] for f in ("furlong-tests.log", "furlong-backup.log") if (root / f).exists())
          body = f"Automated CI diagnostic for {os.environ['GITHUB_SHA'][:12]}\n\nRun: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n```text\n{log[-24000:]}\n```"
          (root / "furlong-ci-issue.md").write_text(body)
          PY
          gh issue create --title "CI failure diagnostics ${GITHUB_SHA:0:12}" --body-file "${RUNNER_TEMP}/furlong-ci-issue.md"
      - name: Fail workflow if validation failed
        if: ${{ steps.regression.outcome == 'failure' || steps.backup.outcome == 'failure' }}
        run: exit 1
