name: Python regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          python -m pip install "pip-audit>=2.7,<3"
          python -m pip_audit --requirement requirements.txt
      - name: Run regression suite
        env:
          FURLONG_DATA_DIR: ${{ runner.temp }}/furlong-data
        run: python -m unittest discover -s tests -v
      - name: Verify database backup and restore
        env:
          FURLONG_DATA_DIR: ${{ runner.temp }}/furlong-data
        run: |
          python -c "import app; app.init_db()"
          python scripts/backup_database.py "${{ runner.temp }}/furlong-backups"
          python scripts/verify_restore.py "${{ runner.temp }}/furlong-backups/"*.db
